# Publishes the container image to Docker Hub (docker.io/dvdstelt/stash) when a version tag such as
# v1.2.0 is pushed. Needs the repository secret DOCKERHUB_TOKEN; see "Releasing" in
# docs/technical.md.
name: Publish image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publish-image

jobs:
  publish:
    # Forks don't have the token for this Docker Hub account.
    if: github.repository == 'dvdstelt/stash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: dvdstelt
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 becomes 1.2.3, 1.2, 1 and latest. A prerelease (v1.3.0-rc.1) gets only its own tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/dvdstelt/stash
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # The Dockerfile cross-compiles, so all platforms build on this one runner without emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
